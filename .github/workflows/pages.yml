name: Deploy to GitHub Pages

# The github-pages environment only accepts deploys from the default branch,
# so this runs on main rather than a feature branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages is already enabled in repository settings with source
      # "GitHub Actions", so this only needs to read that configuration.
      - uses: actions/configure-pages@v5

      # The site is static at the repo root — no build step.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
