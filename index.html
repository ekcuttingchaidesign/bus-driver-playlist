<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>उत्तर प्रदेश परिवहन सेवा</title>
<meta name="description" content="लंबी दूरी की बसों में बजने वाले नब्बे के दशक के गाने।">
<meta name="theme-color" content="#14100c">

<meta property="og:title" content="उत्तर प्रदेश परिवहन सेवा">
<meta property="og:description" content="आपका स्वागत करती है।">
<meta property="og:type" content="website">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" as="font" type="font/woff2" href="fonts/noto-devanagari.woff2" crossorigin>
<link rel="preload" as="image" href="images/01.webp" imagesrcset="images/01-1280.webp 1280w, images/01.webp 1920w" imagesizes="100vw">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage" aria-hidden="true">
  <div class="slides" id="slides">

    <!-- Active from first paint so artwork shows before anything else loads. -->
    <div class="slide is-active" data-slide="0">
      <picture>
        <source type="image/webp" srcset="images/01-1280.webp 1280w, images/01.webp 1920w" sizes="100vw">
        <source type="image/jpeg" srcset="images/01-1280.jpg 1280w, images/01.jpg 1920w" sizes="100vw">
        <img src="images/01.jpg" alt="" decoding="async" fetchpriority="high">
      </picture>
    </div>

    <div class="slide" data-slide="1">
      <picture>
        <source type="image/webp" srcset="images/02-1280.webp 1280w, images/02.webp 1920w" sizes="100vw">
        <source type="image/jpeg" srcset="images/02-1280.jpg 1280w, images/02.jpg 1920w" sizes="100vw">
        <img src="images/02.jpg" alt="" decoding="async" loading="eager">
      </picture>
    </div>

    <div class="slide" data-slide="2">
      <picture>
        <source type="image/webp" srcset="images/03-1280.webp 1280w, images/03.webp 1920w" sizes="100vw">
        <source type="image/jpeg" srcset="images/03-1280.jpg 1280w, images/03.jpg 1920w" sizes="100vw">
        <img src="images/03.jpg" alt="" decoding="async" loading="eager">
      </picture>
    </div>

    <div class="slide" data-slide="3">
      <picture>
        <source type="image/webp" srcset="images/04-1280.webp 1280w, images/04.webp 1920w" sizes="100vw">
        <source type="image/jpeg" srcset="images/04-1280.jpg 1280w, images/04.jpg 1920w" sizes="100vw">
        <img src="images/04.jpg" alt="" decoding="async" loading="eager">
      </picture>
    </div>

  </div>
  <div class="warmth"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>

<header class="masthead">
  <h1 class="masthead__title">उत्तर प्रदेश परिवहन सेवा</h1>
  <p class="masthead__sub">आपका स्वागत करती है</p>
</header>

<!-- Populated from playlist.json → links. Stays hidden if none are set. -->
<nav class="links" id="links" aria-label="कहीं और सुनिए" hidden></nav>

<!-- No entry gate: the play button click is itself the user gesture that
     browsers require before audio may start. The player loads cued and
     paused, and the first press starts it. -->
<div class="hud" id="hud">

  <!-- The circular art IS the YouTube player, clipped to a circle. The
       IFrame API terms require the player stay visible at 200x200 or more,
       so it is the record rather than something hidden behind one. -->
  <div class="player">
    <!-- The ring spins while playing; the disc itself holds the live player
         and stays upright, so the video is never rotated or covered. -->
    <div class="player__art">
      <div class="player__ring" aria-hidden="true"></div>
      <div class="player__disc">
        <div id="ytplayer"></div>
      </div>
    </div>

    <div class="player__meta">
      <p class="player__label">अभी बज रहा है</p>
      <p class="player__title" id="trackTitle" role="status" aria-live="polite">लोड हो रहा है…</p>

      <div class="seek" id="seek" role="slider" tabindex="0"
           aria-label="गाने में आगे या पीछे जाएँ"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="seek__track"><div class="seek__fill" id="seekFill"></div></div>
        <div class="seek__knob" id="seekKnob"></div>
      </div>
      <p class="seek__time"><span id="tCur">0:00</span> / <span id="tDur">0:00</span></p>
    </div>

    <div class="player__controls">
      <button class="btn btn--sm" id="prevBtn" type="button" aria-label="पिछला गाना">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm12 0l-9 6 9 6z"/></svg>
      </button>
      <button class="btn is-paused" id="playBtn" type="button" aria-label="चलाएँ">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-play"><path d="M8 5l11 7-11 7z"/></svg>
      </button>
      <button class="btn" id="nextBtn" type="button" aria-label="अगला गाना">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l9 7-9 7zM16 5h3v14h-3z"/></svg>
      </button>
      <button class="btn" id="muteBtn" type="button" aria-label="आवाज़ बंद करें">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-loud"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-muted"><path d="M4 9v6h4l5 4V5L8 9H4zm11 1.4L16.6 12 15 13.6l1.1 1.1L17.7 13l1.6 1.6 1.1-1.1L18.8 12l1.6-1.6-1.1-1.1-1.6 1.6-1.6-1.6z"/></svg>
      </button>
    </div>
  </div>

  <p class="passengers" id="passengers" hidden></p>
</div>

<script src="app.js"></script>
</body>
</html>
