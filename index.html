<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>उत्तर प्रदेश म्यूज़िकल परिवाहन</title>
<meta name="description" content="लंबी दूरी की बसों में बजने वाले नब्बे के दशक के गाने।">
<meta name="theme-color" content="#14100c">

<link rel="canonical" href="https://upbusdriver.wtf/">

<meta property="og:title" content="उत्तर प्रदेश म्यूज़िकल परिवाहन">
<meta property="og:description" content="आपका स्वागत करती है।">
<meta property="og:type" content="website">
<meta property="og:url" content="https://upbusdriver.wtf/">
<!-- Absolute URL required: previews are fetched by other people's servers,
     which have no page to resolve a relative path against. -->
<meta property="og:image" content="https://upbusdriver.wtf/images/01-1280.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta property="og:image:alt" content="बस के अंदर से सड़क का दृश्य">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" as="font" type="font/woff2" href="fonts/noto-devanagari.woff2" crossorigin>
<link rel="preload" as="image" media="(orientation: landscape)" href="images/01.webp" imagesrcset="images/01-1280.webp 1280w, images/01.webp 1920w" imagesizes="100vw">
<link rel="preload" as="image" media="(orientation: portrait)" href="images/01p.webp" imagesrcset="images/01p-720.webp 720w, images/01p.webp 1080w" imagesizes="100vw">
<!-- ?v= is a cache buster: without it a browser holding an old style.css or
     app.js pairs it with fresh HTML, which breaks the page in confusing ways
     (a stale stylesheet leaves the record face unstyled and the video shows
     through it). Bump the number whenever either file changes. -->
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<div class="stage" aria-hidden="true">
  <div class="slides" id="slides">

    <!-- Active from first paint so artwork shows before anything else loads. -->
    <div class="slide is-active" data-slide="0">
      <picture>
        <source media="(orientation: portrait)" type="image/webp" srcset="images/01p-720.webp 720w, images/01p.webp 1080w" sizes="100vw">
        <source media="(orientation: portrait)" type="image/jpeg" srcset="images/01p-720.jpg 720w, images/01p.jpg 1080w" sizes="100vw">
        <source type="image/webp" srcset="images/01-1280.webp 1280w, images/01.webp 1920w" sizes="100vw">
        <source type="image/jpeg" srcset="images/01-1280.jpg 1280w, images/01.jpg 1920w" sizes="100vw">
        <img src="images/01.jpg" alt="" decoding="async" fetchpriority="high">
      </picture>
    </div>

    <div class="slide" data-slide="1">
      <picture>
        <source media="(orientation: portrait)" type="image/webp" srcset="images/02p-720.webp 720w, images/02p.webp 1080w" sizes="100vw">
        <source media="(orientation: portrait)" type="image/jpeg" srcset="images/02p-720.jpg 720w, images/02p.jpg 1080w" sizes="100vw">
        <source type="image/webp" srcset="images/02-1280.webp 1280w, images/02.webp 1920w" sizes="100vw">
        <source type="image/jpeg" srcset="images/02-1280.jpg 1280w, images/02.jpg 1920w" sizes="100vw">
        <img src="images/02.jpg" alt="" decoding="async" loading="eager">
      </picture>
    </div>

    <!-- ?v= on these: the artwork behind these filenames was replaced while
         the names stayed the same, which is the one change a browser cache
         cannot detect. Bump it whenever a slide's file is swapped. -->
    <div class="slide" data-slide="2">
      <picture>
        <source media="(orientation: portrait)" type="image/webp" srcset="images/03p-720.webp?v=4 720w, images/03p.webp?v=4 1080w" sizes="100vw">
        <source media="(orientation: portrait)" type="image/jpeg" srcset="images/03p-720.jpg?v=4 720w, images/03p.jpg?v=4 1080w" sizes="100vw">
        <source type="image/webp" srcset="images/03-1280.webp?v=3 1280w, images/03.webp?v=3 1920w" sizes="100vw">
        <source type="image/jpeg" srcset="images/03-1280.jpg?v=3 1280w, images/03.jpg?v=3 1920w" sizes="100vw">
        <img src="images/03.jpg?v=3" alt="" decoding="async" loading="eager">
      </picture>
    </div>

    <div class="slide" data-slide="3">
      <picture>
        <source media="(orientation: portrait)" type="image/webp" srcset="images/04p-720.webp 720w, images/04p.webp 1080w" sizes="100vw">
        <source media="(orientation: portrait)" type="image/jpeg" srcset="images/04p-720.jpg 720w, images/04p.jpg 1080w" sizes="100vw">
        <source type="image/webp" srcset="images/04-1280.webp 1280w, images/04.webp 1920w" sizes="100vw">
        <source type="image/jpeg" srcset="images/04-1280.jpg 1280w, images/04.jpg 1920w" sizes="100vw">
        <img src="images/04.jpg" alt="" decoding="async" loading="eager">
      </picture>
    </div>

  </div>
  <div class="warmth"></div>
  <div class="grain"></div>
  <div class="vignette"></div>
</div>

<header class="masthead">
  <!-- EXPERIMENT: hand-painted title artwork in place of live text.
       The source has an opaque black ground, knocked out with
       mix-blend-mode: screen rather than needing a transparent export.
       To roll back, revert this commit — the text version returns. -->
  <h1 class="masthead__title">
    <img src="images/title.webp"
         srcset="images/title-800.webp 760w, images/title.webp 1100w"
         sizes="(max-width:640px) 72vw, min(34vw, 420px)"
         alt="उत्तर प्रदेश म्यूज़िकल परिवाहन" decoding="async" fetchpriority="high">
  </h1>
  <p class="masthead__sub">आपका स्वागत करती है</p>
</header>

<div class="topbar">
  <!-- Populated from playlist.json → links. Stays hidden if none are set. -->
  <nav class="links" id="links" aria-label="कहीं और सुनिए" hidden></nav>

  <!-- Traffic bed on its own, independent of the site-wide mute. -->
  <button class="amb" id="ambBtn" type="button" aria-label="Turn ambience off" aria-pressed="true">
    <span class="amb__dot" aria-hidden="true"></span>
    <span class="amb__label">AMBIENCE</span>
  </button>

  <!-- Mutes everything: music, horn and ambience. -->
  <button class="mute" id="muteBtn" type="button" aria-label="आवाज़ बंद करें">
    <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-loud"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg>
    <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-muted"><path d="M4 9v6h4l5 4V5L8 9H4zm11 1.4L16.6 12 15 13.6l1.1 1.1L17.7 13l1.6 1.6 1.1-1.1L18.8 12l1.6-1.6-1.1-1.1-1.6 1.6-1.6-1.6z"/></svg>
  </button>

  <!-- Opens the interruption. Same shape as mute so the pair reads as a set. -->
  <button class="mute skull" id="skullBtn" type="button" aria-label="Something else entirely">
    <!-- Sized in the markup, not only in CSS: the file's own dimensions are
         58x66, so a browser holding an older stylesheet would render it at
         that size and burst out of the 42px circle. -->
    <img src="skull.svg" alt="" aria-hidden="true" width="21" height="21">
  </button>
</div>

<!-- The interruption. Hidden until the skull is pressed, then it takes the
     whole screen: the words alternate on a fixed beat, the audio loops, and
     nothing returns to normal until SAVE ME PLEASE is pressed. -->
<div class="fine" id="fine" hidden>
  <div class="fine__bg" aria-hidden="true"></div>

  <!-- Two full-screen fields of the same word, tiled. Only one is lit at a
       time; JS alternates them on the beat. Rows are populated by JS so the
       count adapts to the viewport instead of being guessed here. -->
  <div class="fine__field fine__field--fine" id="fieldFine" aria-hidden="true"></div>
  <div class="fine__field fine__field--shyt" id="fieldShyt" aria-hidden="true"></div>

  <img class="fine__face" src="fineshyt.png" alt="" decoding="async">

  <button class="fine__stop" id="fineStop" type="button">SAVE ME PLEASE</button>

  <!-- Audio source for this mode: the same YouTube route the songs take,
       kept out of sight rather than made part of the composition. -->
  <div class="fine__player" aria-hidden="true"><div id="fineplayer"></div></div>
</div>

<!-- No entry gate: the play button click is itself the user gesture that
     browsers require before audio may start. The player loads cued and
     paused, and the first press starts it. -->
<div class="hud" id="hud">

  <!-- The circular art is a spinning record. The live YouTube player still
       sits inside the disc at its full 200px size — it supplies the audio —
       with the vinyl face drawn over it, so what you see is the artwork
       rather than the video. -->
  <div class="player">
    <!-- Ring and vinyl turn together at the same rate while playing. -->
    <div class="player__art">
      <div class="player__ring" aria-hidden="true"></div>
      <div class="player__disc">
        <div id="ytplayer"></div>
        <div class="player__vinyl" aria-hidden="true">
          <!-- Label art: the current track's YouTube thumbnail. Fades in
               once loaded; if it 404s the bare label is left showing. -->
          <img class="player__thumb" id="discArt" src="" alt="" decoding="async">
          <span class="player__spindle"></span>
        </div>
      </div>
    </div>

    <div class="player__meta">
      <p class="player__label">Now Playing</p>
      <p class="player__title" id="trackTitle" role="status" aria-live="polite">लोड हो रहा है…</p>

      <div class="seek" id="seek" role="slider" tabindex="0"
           aria-label="गाने में आगे या पीछे जाएँ"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="seek__track"><div class="seek__fill" id="seekFill"></div></div>
        <div class="seek__knob" id="seekKnob"></div>
      </div>
      <p class="seek__time"><span id="tCur">0:00</span> / <span id="tDur">0:00</span></p>
    </div>

    <div class="player__controls">
      <button class="btn btn--sm" id="prevBtn" type="button" aria-label="पिछला गाना">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm12 0l-9 6 9 6z"/></svg>
      </button>
      <button class="btn is-paused" id="playBtn" type="button" aria-label="चलाएँ">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="ico-play"><path d="M8 5l11 7-11 7z"/></svg>
      </button>
      <button class="btn" id="nextBtn" type="button" aria-label="अगला गाना">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5l9 7-9 7zM16 5h3v14h-3z"/></svg>
      </button>
    </div>
  </div>

  <p class="passengers" id="passengers" hidden></p>

  <!-- The ads between songs are not a bug, so the site owns up to them. -->
  <p class="note">Driver k pass Youtube premium nhi hai</p>
</div>

<script src="app.js?v=3"></script>
</body>
</html>
